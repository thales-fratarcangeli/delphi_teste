; ===========================================================================
; Configuração geral do ERP. Lida pelo DataModule e pela camada uConfig.pas.
; Deixe uma cópia deste arquivo ao lado de CADA .exe gerado.
;
; ATENÇÃO: aqui ficam credenciais. Em produção NUNCA se deixa senha em texto
; puro num .ini. Use um cofre/criptografia. Aqui está assim só para estudo.
; ===========================================================================

[BancoDeDados]
Database=C:\Users\sigma\Documents\delphi\banco\ERP.FDB
Server=localhost
Port=3050
User=SYSDBA
Password=masterkey
CharacterSet=WIN1252

; --- Integração com a SEFAZ (emissão de NF-e / NFC-e) -----------------------
[SEFAZ]
; Ambiente: HOMOLOGACAO (teste, sem valor fiscal) ou PRODUCAO
Ambiente=HOMOLOGACAO
UF=SP
; Dados do emitente (sua empresa)
CNPJ=00000000000000
RazaoSocial=EMPRESA DE ESTUDO LTDA
InscricaoEstadual=000000000000
; Certificado digital A1 (arquivo .pfx) e sua senha
CaminhoCertificado=C:\certificados\empresa.pfx
SenhaCertificado=
; CSC / Token (usados na NFC-e, modelo 65)
CSC=
IdTokenCSC=1
; URL do webservice (varia por UF e ambiente). Deixe em branco para simular.
UrlWebservice=

; --- Envio de e-mail (XML/DANFE por e-mail) ---------------------------------
[Email]
Servidor=smtp.gmail.com
Porta=587
Usuario=seuemail@gmail.com
Senha=
UsarTLS=1
Remetente=seuemail@gmail.com
NomeRemetente=ERP Didático

; --- TEF / Máquina de cartão ------------------------------------------------
[TEF]
; Provedor da maquininha: SIMULADO, PAYGO, SITEF, STONE, CIELO...
Provedor=SIMULADO
; Alguns provedores usam um "ponto de captura" ou terminal id
TerminalId=0001
ChaveIntegracao=

; --- Assistente de IA (a "bolinha" no canto) --------------------------------
[IA]
; Endpoint e modelo do provedor de IA. Padrão: API da Anthropic (Claude).
Endpoint=https://api.anthropic.com/v1/messages
Modelo=claude-opus-4-8
ApiKey=
; Nome que aparece na bolinha
NomeAssistente=Assistente ERP

; --- Jenkins (execução das rotinas do sistema) ------------------------------
[Jenkins]
; URL do servidor Jenkins (ex.: http://192.168.0.10:8080)
Url=
Usuario=
; API Token do Jenkins (gerado no perfil do usuário no Jenkins)
Token=

; --- API REST (usada pelo aplicativo mobile Flutter) ------------------------
[APIRest]
UrlBase=http://localhost:8080
